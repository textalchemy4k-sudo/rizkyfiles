<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#16171b;font-family:Arial,Helvetica,sans-serif;color:#e8e6e0;width:2400px}
h1{font-size:34px;margin:28px 36px 6px}.sub{margin:0 36px 22px;color:#a8a6a0;font-size:20px}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;padding:0 36px 36px}
.c{background:#22242a;border-radius:10px;overflow:hidden}.c img{width:100%;display:block}
.m{padding:10px 12px 14px}.n{font-weight:bold;font-size:22px}.t{color:#e8b21a;font-size:18px;margin-left:8px}
.tr{display:inline-block;margin-top:6px;font-size:15px;background:#3a3d46;border-radius:4px;padding:2px 7px;color:#cfd3dc}
.tr.f{background:#6a4a1a;color:#ffe2a8}.vo{font-size:17px;margin-top:8px;line-height:1.3;color:#f2f0ea}
</style></head><body><h1 id="h"></h1><div class="sub" id="s"></div><div class="g" id="g"></div><script>
const q=new URLSearchParams(location.search),a=+q.get('a'),b=+q.get('b');
fetch('beats.json').then(r=>r.json()).then(B=>{document.getElementById('h').textContent=(q.get('title')||'Storyboard')+' ('+(a+1)+'-'+b+' of '+B.length+')';document.getElementById('s').textContent='One still per beat, timed to the voice. Gold = voice time in seconds; tag = transition into the beat.';
const g=document.getElementById('g');B.slice(a,b).forEach(x=>{const n=String(x.n-1).padStart(3,'0');g.insertAdjacentHTML('beforeend',`<div class="c"><img src="board/s${n}.jpg"><div class="m"><span class="n">${x.n}</span><span class="t">${x.t} s</span><br><span class="tr ${/FADE/.test(x.tr)?'f':''}">${x.tr}</span><div class="vo">"${x.vo}"</div></div></div>`)});setTimeout(()=>window.done=true,1500)});
</script></body></html>
